<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;overflow:hidden;background-color:#FFF;color:black;font-family:sans-serif;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebFabric</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      #launcher-menu button {
        padding: 10px 20px;
        margin-top: 15px;
        cursor: pointer;
        background: #4CAF50;
        color: black;
        font-size: 16px;
      }
      #launcher-menu button:disabled {
        background: #666;
        cursor: not-allowed;
      }
      #status {
        margin-top: 15px;
        font-size: 14px;
        color: #000;
      }
      #game-container {
        display: none;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
      }
      .hint {
        font-size: 12px;
        opacity: 0.65;
        max-width: 60ch;
      }
    </style>
  </head>
  <body>

    <div id="launcher-menu">
      <h2>WebFabric Launcher v10 - Made by Cucuzacu</h2>
      <p class="hint">
        Minecraft 1.6.4 on LegacyFabric with Fabric Loader 0.18.2.
        Mods are bundled with the launcher, so there is nothing to upload.
        Graphics start on low settings for speed - change them in Options once you are in.
      </p>

      <div>
        <label for="username-input">Username: </label>
        <br>
        <input type="text" id="username-input" value="Player">
      </div>
      <br>

      <div>
        <label for="resourcepack-upload">Select Resourcepacks (.zip): </label>
        <br><br>
        <input type="file" id="resourcepack-upload" multiple accept=".zip">
      </div>

      <button id="upload-resourcepack-btn">1. Upload Resourcepacks</button>
      <br>
      <button id="start-btn" disabled>2. Start Game</button>

      <div id="status">Initializing Cheerpj...</div>
    </div>

    <div id="game-container">
      <minecraft-client style="width: 854px; height: 480px;"></minecraft-client>
    </div>

    <script type="module">
      import MinecraftClient from "./minecraft-web.js";

      const statusText = document.getElementById("status");
      const resourcepackInput = document.getElementById("resourcepack-upload");
      const uploadResourcepackBtn = document.getElementById("upload-resourcepack-btn");
      const startBtn = document.getElementById("start-btn");
      const menu = document.getElementById("launcher-menu");
      const gameContainer = document.getElementById("game-container");

      const nativesPath = `/app${new URL("natives", import.meta.url).pathname}`;

      await cheerpjInit({
        version: MinecraftClient.JAVA_VERSION,
        javaProperties: [
          `java.library.path=${nativesPath}`,
          "org.lwjgl.util.NoChecks=true",
          `java.class.path=${MinecraftClient.CLASSPATH}`,
          ...MinecraftClient.FABRIC_PROPERTIES,
        ],
      });
      const lib = await cheerpjRunLibrary("");

      statusText.innerText = "Installing bundled mods...";
      try {
        await MinecraftClient.installBundledMods(lib, (message) => {
          statusText.innerText = message;
        });
        statusText.innerText = "Ready. You can upload resourcepacks or start.";
      } catch (error) {
        console.error("Could not install the bundled mods:", error);
        statusText.innerText = "Warning: could not install the bundled mods. See console.";
      }

      startBtn.disabled = false;

      uploadResourcepackBtn.addEventListener("click", async () => {
        if (resourcepackInput.files.length === 0) {
          alert("Please select at least one resourcepack file!");
          return;
        }

        uploadResourcepackBtn.disabled = true;
        startBtn.disabled = true;
        statusText.innerText = "Preparing fs...";

        try {
          const Files = await lib.java.nio.file.Files;
          const Paths = await lib.java.nio.file.Paths;
          const StandardCopyOption = await lib.java.nio.file.StandardCopyOption;

          const resourcepacksDir = await Paths.get("/files/game/resourcepacks");
          await Files.createDirectories(resourcepacksDir);

          for (const file of resourcepackInput.files) {
            statusText.innerText = `Uploading: ${file.name}...`;

            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            const strPath = `/str/${file.name}`;
            cheerpOSAddStringFile(strPath, uint8Array);

            const source = await Paths.get(strPath);
            const target = await Paths.get(`/files/game/resourcepacks/${file.name}`);

            await Files.copy(source, target, [StandardCopyOption.REPLACE_EXISTING]);
            console.log(`Successfully moved ${file.name} to /files/game/resourcepacks/`);
          }

          statusText.innerText = "All resourcepacks uploaded! Ready to start.";
          uploadResourcepackBtn.innerText = "Uploaded ✓";
        } catch (error) {
          console.error("Upload failed:", error);
          statusText.innerText = "Error uploading resourcepacks. See console.";
        } finally {
          startBtn.disabled = false;
          uploadResourcepackBtn.disabled = false;
        }
      });

      const usernameInput = document.getElementById("username-input");

      startBtn.addEventListener("click", () => {
        menu.style.display = "none";
        gameContainer.style.display = "flex";

        MinecraftClient.register();

        const clientElement = document.querySelector("minecraft-client");
        const username = usernameInput.value || "Player";
        clientElement.run(username);
      });
    </script>
  </body>
</html>
